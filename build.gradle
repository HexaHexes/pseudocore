plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Game tests live in their own source set: they compile against main and the same
// optional mod jars, run under the gameTestServer run below, and are deliberately
// NOT part of sourceSets.main - so none of it is packaged into the released jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

repositories {
    // CurseMaven - resolves mod jars by CurseForge project + file id.
    maven {
        name = "CurseMaven"
        url = uri("https://cursemaven.com")
        content { includeGroup("curse.maven") }
    }
    mavenCentral()

    // mob-info-common, from the org's GitHub Packages registry. Reads always
    // require auth, and GitHub answers 404 (not 401) when it is missing, so an
    // unauthenticated build fails with a message that looks like a mistyped
    // coordinate. CI injects PACKAGE_READ_TOKEN (a read:packages token - the
    // workflow GITHUB_TOKEN cannot read a package owned by another repo, and
    // publish.yml needs its own GITHUB_TOKEN for the write side); locally
    // supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/mob-info-common')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('PACKAGE_READ_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Headless test runner: loads the game test server, runs every registered
        // @GameTest, then exits with the count of failed required tests as the exit
        // code. Never opens a window, so `gradlew runGameTestServer` is CI-safe.
        gameTestServer {
            type = "gameTestServer"
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // The gametest source set joins the mod only for the gameTestServer run,
            // so FML's scan data picks up @GameTestHolder there - while none of its
            // classes reach the released jar.
            sourceSet(sourceSets.gametest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    // Resolved manascore core artifact; its nested module jars are extracted
    // into build/ for the compile classpath (see extractManascoreModules).
    manascoreModules
}

// Compiled-against view of the extracted manascore module jars; the file
// collection carries the task dependency, so javac always sees fresh output.
def manascoreModuleJars = files(fileTree(dir: layout.buildDirectory.dir('manascore-modules').get().asFile, include: '**/*.jar'))
manascoreModuleJars.builtBy 'extractManascoreModules'

dependencies {
    // -------------------------------------------------------------------------
    // Tensura + ManasCore: compile against the real API (EP / ownership), but
    // keep them OFF the published POM and off the required-mod list so the addon
    // still loads when Tensura is absent. All Tensura-touching code is isolated
    // behind a ModList gate at runtime. The pin is 2.0.1.3 - the version the
    // shared mob-info library and Tensura Jade ship against, so all three
    // compile against one jar; bump deliberately, never implicitly.
    // -------------------------------------------------------------------------
    compileOnly "curse.maven:tensura-reincarnated-643695:8793360" // tensura-neoforge-2.0.1.3
    compileOnly "curse.maven:manascore-619025:8022425"
    // ManasCore's main jar nests its sub-modules under META-INF/jars; the build
    // extracts them so javac sees the module APIs (StorageHolder). Derived from
    // the resolved Maven artifact - nothing is committed.
    compileOnly manascoreModuleJars

    // mob-info-common: the shared variant-name and analysis-gating logic, a
    // required mod (see neoforge.mods.toml) resolved from the org's GitHub
    // Packages registry. Never packaged - the library ships as its own mod.
    compileOnly "org.bitwisemadness.mobinfocommon:mob_info_common:${mob_info_common_version}"
    runtimeOnly "org.bitwisemadness.mobinfocommon:mob_info_common:${mob_info_common_version}"

    manascoreModules 'curse.maven:manascore-619025:8022425'

    // Run-time classpath for dev runs ONLY (runClient / runServer). Not published.
    localRuntime "curse.maven:tensura-reincarnated-643695:8793360" // tensura-neoforge-2.0.1.3
    localRuntime "curse.maven:manascore-619025:8022425"
    // Tensura's own required libraries (only needed for dev runs).
    localRuntime "curse.maven:architectury-api-419699:5786327"
    localRuntime "curse.maven:geckolib-388172:8309311"
    localRuntime "curse.maven:smartbrainlib-661293:7055149"
    localRuntime "curse.maven:terrablender-neoforge-940057:6054947"

    // -------------------------------------------------------------------------
    // Ice and Fire CE: optional. Needed at compile time for the Dragon Horn mixin
    // target classes; optional at runtime (the mixin config is gated on it).
    // -------------------------------------------------------------------------
    compileOnly "curse.maven:iceandfire-ce-1040076:9128508"
    localRuntime "curse.maven:iceandfire-ce-1040076:9128508"

    // Ice and Fire CE 2.1.4 hard-requires these two and refuses to load without them,
    // so every dev run - gameTestServer included - carries them exactly as the pack
    // does. Uranus sits on the compile classpath: DragonBaseEntity's hierarchy
    // implements Uranus interfaces, so referencing a dragon's growth stage - which
    // the dragon line does - cannot be compiled without those types resolvable.
    // Jupiter now does too: reading maxTamedDragonAge for the stage bridge (#48)
    // dereferences its IntegerEntry, which javac needs to see even though the call
    // is just getValue(). compileOnly on both, so nothing ships.
    localRuntime 'curse.maven:jupiter-1072905:7738312' // jupiter-2.3.7
    compileOnly 'curse.maven:jupiter-1072905:7738312' // jupiter-2.3.7
    localRuntime 'curse.maven:uranus-1010827:8587525' // uranus-2.4.1-bugfix
    compileOnly 'curse.maven:uranus-1010827:8587525' // uranus-2.4.1-bugfix

    // -------------------------------------------------------------------------
    // Mobs of Mythology + Mysticism are no longer compiled against here at all:
    // their variant names moved into the shared mob-info library, which owns
    // both access classes and gates them itself.
    // -------------------------------------------------------------------------

    // Lightman's Currency. Referenced ONLY by the game tests that prove a horn listed
    // for sale reaches the buyer with its captured mob intact - main never touches it.
    // compileOnly keeps it off the published POM and off the required-mod list;
    // localRuntime puts it on the gameTestServer run, which needs the mod present to
    // load those tests at all. It ships in this same pack, so the dev runs carrying it
    // is simply what the mod actually runs with.
    compileOnly 'curse.maven:lightmans-currency-472521:9048585' // lightmanscurrency-2.3.0.6
    localRuntime 'curse.maven:lightmans-currency-472521:9048585'
}

// Extract manascore's nested module jars - byte-identical to the retired
// libs/ copies - into build/ so javac sees the module APIs (StorageHolder and
// friends). Derived entirely from the resolved Maven artifact.
tasks.register('extractManascoreModules', Sync) {
    from { zipTree(configurations.manascoreModules.singleFile) }
    include 'META-INF/jars/*.jar'
    into layout.buildDirectory.dir('manascore-modules')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mob_info_common_version: mob_info_common_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/pseudocore')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// --- JUnit wiring (junit CI check) -------------------------------------------

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// Both tools gate in the `static` CI job: SpotBugs findings fail
// `spotbugsMain` and Spotless violations fail `spotlessCheck`. SpotBugs sits
// on the `check` graph, so `./gradlew build` fails on findings too; Spotless
// stays detached (`enforceCheck false`), keeping the junit job's build
// style-agnostic by design - the static check is the style gate, junit is
// not. The SpotBugs HTML report still uploads as the `spotbugs-report`
// artifact every run (the CI step uses if: always()).
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    // Shared EI_EXPOSE_REP/EI_EXPOSE_REP2 exclusions; scope rule in the file.
    excludeFilter = file('config/spotbugs-exclude.xml')}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

// checkstyle 10.21.0 pins guava 33.3.1-jre, which dependency-review flags
// as introduced by every PR (GHSA-xxph-c9ww-hj94, high, patched 33.7.2).
// Force the patched line on the tool classpath only - checkstyle runs at
// build time, never ships in the mod jar, and 33.x is backwards compatible.
configurations.named('checkstyle') {
    resolutionStrategy.force 'com.google.guava:guava:33.7.2-jre'
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
