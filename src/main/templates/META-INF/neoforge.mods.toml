# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more are optional (#optional).
# The overall format is standard TOML format, v0.5.0.

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# The description text for the mod (multi line!) (#mandatory)
description='''
Pseudocore - capture any mob with its full NBT data and trade it between players.
'''

# The Pseudocore mixin config. Always present.
[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config="pseudocore.mixins.json"

# The Ice and Fire CE compatibility mixin. Only loaded when Ice and Fire CE is
# present, so the addon still starts (without the Dragon Horn behavior) if it is
# ever removed. Belt-and-braces: the mixin config also carries an
# IMixinConfigPlugin that re-checks ModList, in case a loader ignores this.
[[mixins]]
config="pseudocore.iaf.mixins.json"
requiredMods=["iceandfire"]

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.pseudocore]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    type="required" #mandatory
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

[[dependencies.pseudocore]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Tensura: optional. Enables EP display and ownership transfer on release.
# Floor = 2.0.1.3, the version this repo compiles and gates against
# (build.gradle) and the version the pack runs.
[[dependencies.pseudocore]]
    modId="tensura"
    type="optional"
    versionRange="[2.0.1.3,)"
    ordering="AFTER"
    side="BOTH"

# ManasCore: optional (required by Tensura). Provides the storage API we read EP/owner through.
# Floor = 4.0.0.2, the version this repo compiles and gates against and
# the version the pack runs.
[[dependencies.pseudocore]]
    modId="manascore"
    type="optional"
    versionRange="[4.0.0.2,)"
    ordering="AFTER"
    side="BOTH"

# Ice and Fire CE: optional. Provides the Dragon Horn whose release-path ownership
# this addon makes transferable via the pseudocoreDragonOwnershipTransfer gamerule.
# Floor = 2.0-beta.15 (the pack's build; Maven orders it below 2.1.4, the
# dev/CI-staged build, so the floor admits both).
[[dependencies.pseudocore]]
    modId="iceandfire"
    type="optional"
    versionRange="[2.0-beta.15,)"
    ordering="AFTER"
    side="BOTH"

# Mob Info Common - required. The shared variant-name and analysis-gating library:
# the Race line's variant names and the tooltip's analysis gating both read it.
# Ships as its own mod in the pack.
[[dependencies.pseudocore]]
    modId="mob_info_common"
    type="required"
    versionRange="[${mob_info_common_version},)"
    ordering="AFTER"
    side="BOTH"

# Ability Core - optional (the #174 cost seam): the bridge gates every call
# on ModList, so the addon behaves exactly as before without it. Floor =
# alpha.42, the first build with #110's refund contract (and #108's
# corrected XP deduction), which routed refunds consume - the same pin
# build.gradle compiles and gates against.
[[dependencies.pseudocore]]
    modId="ability_core"
    type="optional"
    versionRange="[1.0.0-alpha.42,)"
    ordering="AFTER"
    side="BOTH"
